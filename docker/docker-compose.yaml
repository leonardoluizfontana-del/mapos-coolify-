#Enable: Preserve repository during deploymen
#Base directory: /
#Docker compose location: /docker/docker-compose.yaml
#Branch: Main
#
#Permission
#mkdir -p /data/coolify/applications/<UUID>/updates
#chmod -R 775 /data/coolify/applications/<UUID>/updates
#chown -R 33:33 /data/coolify/applications/<UUID>/updates
#
#https://coolify.com/project/.../application/ajqs9c6vepe3sddxdof48ktq
#UUID = ajqs9c6vepe3sddxdof48ktq
#
version: '3.9'
services:
  nginx:
    build:
      context: ./docker/etc/nginx
      dockerfile: Dockerfile
    container_name: nginx
    volumes:
      - "./:/var/www/html"
    expose:
      - "${NGINX_PORT}"
    ports:
      - "${NGINX_PORT}:${NGINX_PORT}"
    env_file:
      - "./docker/.env"
    command: /bin/sh -c "envsubst '$$NGINX_HOST $$NGINX_PORT' < /etc/nginx/conf.d/default.template > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
    restart: always
    depends_on:
      - php-fpm
      - mysql
  php-fpm:
    container_name: php-fpm
    build:
      context: ./docker/etc/php
      dockerfile: Dockerfile
    restart: always
    volumes:
      - "./docker/etc/php/php.ini:/usr/local/etc/php/conf.d/php.ini"
      - "./docker/etc/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini"
      - "./:/var/www/html"
  composer:
    container_name: composer
    restart: "no"
    build:
      context: ./docker/etc/composer
      dockerfile: Dockerfile
    volumes:
      - "./:/app"
    command: install --ignore-platform-reqs --no-scripts
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    ports:
      - "${PHP_MY_ADMIN_PORT}:80"
    environment:
      - PMA_ARBITRARY=1
      - PMA_HOST=${MYSQL_MAPOS_HOST}
      - PMA_USER=${MYSQL_MAPOS_USER}
      - PMA_PASSWORD=${MYSQL_MAPOS_PASSWORD}
    restart: always
    depends_on:
      - mysql
  mysql:
    image: mysql:${MYSQL_MAPOS_VERSION}
    container_name: mysql
    restart: always
    env_file:
      - "./docker/.env"
    environment:
      - MYSQL_DATABASE=${MYSQL_MAPOS_DATABASE}
      - MYSQL_ROOT_PASSWORD=${MYSQL_MAPOS_ROOT_PASSWORD}
      - MYSQL_USER=${MYSQL_MAPOS_USER}
      - MYSQL_PASSWORD=${MYSQL_MAPOS_PASSWORD}
    ports:
      - "${MYSQL_MAPOS_PORT}:3306"
    volumes:
      - "./docker/data/db/mysql:/var/lib/mysql"
